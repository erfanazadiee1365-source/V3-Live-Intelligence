name: V3 Nobitex Live Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  v3-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout V3
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V3 Nobitex scan
        shell: bash
        run: |
          set +e
          timeout 60s python -u main.py
          code=$?

          if [ "$code" -eq 124 ]; then
            echo "V3 scan reached 60-second runtime limit."
            exit 0
          fi

          exit "$code"
      - name: Run V3 Early Wake
        shell: bash
        run: |
          python -u early_wake.py
      - name: Show latest radar
        if: always()
        shell: bash
        run: |
          echo "===== V3 LATEST RADAR ====="

          if [ -f latest_radar.json ]; then
            cat latest_radar.json
          else
            echo "latest_radar.json was not created."
          fi
      - name: Persist V3 five-minute history
        if: success()
        shell: bash
        run: |
          git config user.name "v3-live-bot"
          git config user.email "v3-live-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new V3 data to persist."
            exit 0
          fi

          git commit -m "data: persist V3 5m snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
